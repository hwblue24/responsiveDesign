<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Document</title>
</head>
<body>
    <header>
        <div class="headerContainer">
            <div class="srvImgContainer">
                <img src="images/pexels-philevenphotos-37215520.jpg" alt="srv-image" class="srvImage">
            </div>
            <div class="headerScriptContainer">
                <h2>SRV</h2>
                Stevie Ray Vaughan Texas Blues legend<br>
                reignited the blues genre from the 80's<br>
                influencing a generation of players.
                
                <div class="socials">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linkedin/linkedin-original.svg" />
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg" />
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/twitter/twitter-original.svg" /> 
                </div>
            </div>
        </div>
    </header>
    <main>
        <section>
            <div class="content">
                <div class="contentImages">
                    <img src="/images/StevieRayVaughanTexasFlood.jpg" alt="TexasFlood">

                </div>
                <div class="contentInfo">
                    <h2>Texas Flood</h2>
                </div>
            </div>
            <div class="content">
                <div class="contentImages">
                    <img src="/images/SRVcouldntstandtheweather.jpg" alt="Couldn'tStandTheWeather">
                </div>
                <div class="contentInfo">
                    <h2>Couldn't Stand the Weather</h2>
                </div>
            </div>
            <div class="content">
                <div class="contentImages">
                    <img src="/images/SRVsoultosoul.jpg" alt="SoultToSoul">
                </div>
                <div class="contentInfo">
                    <h2>Soul to Soul</h2>
                </div>
            </div>
            <div class="content">
                <div class="contentImages">
                    <img src="/images/SRVinstep.jpg" alt="InStep">
                </div>
                <div class="contentInfo">
                    <h2>In Step</h2>
                </div>
            </div>
            <div class="content">
                <div class="contentImages">
                    <img src="/images/SRVtheskyiscrying.jpg" alt="TheSkyIsCrying">
                </div>
                <div class="contentInfo">
                    <h2>The Sky Is Crying</h2>
                </div>
            </div>
            <div class="content">
                <div class="contentImages">
                    <img src="/images/AlbertKingWithStevieRayVaughnInSessionCHCH.jpg" alt="InSession">
                </div>
                <div class="contentInfo">
                    <h2>In Session</h2>
                </div>
            </div>
            
        </section>
    </main>
    <footer>
        <div class="contact">
            <!--<img src="images/phone-classic.svg" alt="phone-classic">
            <img src="images/mailbox-up.svg" alt="mailbox"> -->
        </div>
        <div class="strat">
          <!--  <img src="images/pexels-zan-carvalho-2104229-6794588.jpg" alt="strat"> -->
        </div>
    </footer>

    
</body>
</html>
